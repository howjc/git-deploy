# Copy to deploy.toml in the Git project root; deploy.toml should remain untracked.
default_target = "dev"

[source]
include = ["**"]
exclude = [
  "tests/**",
  "docs/**",
]
protect = [
  "storage/private/**",
]
require_clean_worktree = false

# Trusted shell commands run serially in the project root.
[build]
steps = [
  "pnpm install --frozen-lockfile",
  "pnpm run build",
  "composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction",
]
timeout = 900

[[outputs]]
local = "dist"
remote = "public/dist"
delete_removed = true

[[outputs]]
local = "vendor"
remote = "vendor"
delete_removed = true

[targets.dev]
protocol = "sftp"
ssh_host_alias = "project-dev"
remote_root = "/srv/project-dev"
after_deploy = [
  "php artisan optimize:clear",
  "sudo -n /usr/bin/systemctl restart application.service",
  "sudo -n /usr/bin/systemctl is-active --quiet application.service",
]
command_timeout = 120

[targets.prod]
protocol = "ftp"
host = "ftp.example.com"
username = "deploy"
password_env = "DEPLOY_FTP_PASSWORD"
remote_root = "/public_html"
passive = true
timeout = 15

[deploy]
retries = 3
retry_delay = 2
# Parallel FTP control sessions for Hybrid Stage/Publish (1–16; default 1 = serial).
# Raise only after the FTP server proves concurrent control sessions.
ftp_connections = 1
