name: CI

on:
  push:
    branches: [main, "agent/**", "rewrite/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-py-${{ matrix.python-version }}

      - name: Verify Python matrix interpreter
        run: |
          uv run python -c "import sys; expected='${{ matrix.python-version }}'; actual=f'{sys.version_info.major}.{sys.version_info.minor}'; print(sys.version); assert actual == expected, (actual, expected)"

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest -q

      - name: Ruff
        run: uv run ruff check src tests

      - name: ty (type check)
        run: uv run ty check src

      - name: Build package
        run: uv build --clear

      - name: Install built wheel in isolation and smoke test
        run: uv run python tests/smoke_wheel.py
