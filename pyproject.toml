[project]
name = "git-deploy"
version = "1.7.3"
description = "Git-aware local build and FTP/SFTP file synchronization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=5.0.0",
]

[project.scripts]
git-deploy = "git_deploy.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyftpdlib>=2.0.0",
    "ruff>=0.12.0",
    "ty>=0.0.1a15",
]
