[project]
name = "git-deploy"
version = "1.8.1"
description = "Git-aware local build and FTP/SFTP file synchronization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jack" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "argcomplete>=3.7.0",
    "paramiko>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/howjc/git-deploy"
Repository = "https://github.com/howjc/git-deploy"
Issues = "https://github.com/howjc/git-deploy/issues"
Changelog = "https://github.com/howjc/git-deploy/blob/main/docs/releases/v1.8.1.md"

[project.scripts]
git-deploy = "git_deploy.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyftpdlib>=2.0.0",
    "ruff>=0.12.0",
    "ty>=0.0.1a15",
]
